<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vulnerable Message Board</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .board {
            width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 56px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 24px;
            resize: none;
        }

        button {
            margin-top: 25px;
            padding: 20px 50px;
            font-size: 28px;
            cursor: pointer;
        }

        #messages {
            margin-top: 50px;
            font-size: 32px;
        }
    </style>
</head>

<body>

<div class="board">

    <h1>Message Board</h1>

    <textarea id="message"><img src=x onerror="alert('Ocurrio un Script Injection!')"></textarea>

    <br>

    <button onclick="postMessage()">Post Message</button>

    <div id="messages"></div>

</div>

<script>
function postMessage() {
    const message = document.getElementById("message").value;

    // DELIBERATELY VULNERABLE
    document.getElementById("messages").innerHTML +=
        "<p>" + message + "</p>";
}
</script>

</body>
</html>
